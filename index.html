<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nexora - Messaging App by MultiGen Ai</title>
<style>
  /* Reset & base */
  * {
    box-sizing: border-box;
  }
  body {
    margin:0; padding:0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: #eee;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #app {
    width: 350px;
    height: 600px;
    background: #1e1e2f;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  /* Header */
  header {
    background: linear-gradient(90deg, #4b6cb7, #182848);
    color: #fff;
    padding: 15px 20px;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  header .company {
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1.2px;
  }
  /* Chat container */
  #chat {
    flex: 1;
    background: #121212;
    padding: 10px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  /* Chat bubble base */
  .message {
    max-width: 75%;
    margin-bottom: 12px;
    padding: 10px 15px;
    border-radius: 20px;
    position: relative;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  /* Left side (User 1) */
  .msg-left {
    background: linear-gradient(135deg, #6a8de3, #3a529b);
    border-bottom-left-radius: 4px;
    color: #f0f7ff;
    align-self: flex-start;
  }
  /* Right side (User 2) */
  .msg-right {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    border-bottom-right-radius: 4px;
    color: #e0f7ff;
    align-self: flex-end;
  }
  /* Timestamp */
  .timestamp {
    font-size: 10px;
    opacity: 0.5;
    position: absolute;
    bottom: 3px;
    right: 10px;
    user-select: none;
  }
  /* Input container */
  #input-section {
    background: #24243e;
    padding: 10px 15px;
    display: flex;
    align-items: center;
  }
  #input {
    flex: 1;
    border-radius: 50px;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    background: #2e2e4a;
    color: #eee;
    outline: none;
    transition: background 0.2s ease-in-out;
  }
  #input::placeholder {
    color: #bbb;
  }
  #input:focus {
    background: #48487b;
  }
  button#send-btn {
    background: #00aaff;
    border: none;
    color: white;
    font-weight: 700;
    padding: 10px 16px;
    margin-left: 10px;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.3s ease;
    user-select: none;
  }
  button#send-btn:disabled {
    background: #555;
    cursor: not-allowed;
  }
  button#send-btn:hover:not(:disabled) {
    background: #008fcc;
  }
  /* Toggle user button */
  #toggle-user {
    background: #0f3557;
    border: none;
    color: #8fc1ff;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease;
  }
  #toggle-user:hover {
    background: #1750a6;
  }
  /* Media preview */
  #media-preview {
    max-width: 120px;
    max-height: 120px;
    border-radius: 12px;
    margin-right: 8px;
    object-fit: cover;
    display: none;
  }
  /* Attach image button style */
  #attach-label {
    background: #4458f7;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-left: 10px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #attach-label:hover {
    background: #2a36d8;
  }
  #attach-label svg {
    fill: white;
    width: 20px;
    height: 20px;
  }
  #attach-btn {
    display: none;
  }
  /* Scrollbar styling */
  #chat::-webkit-scrollbar {
    width: 6px;
  }
  #chat::-webkit-scrollbar-track {
    background: #1e1e2f;
  }
  #chat::-webkit-scrollbar-thumb {
    background: #4a4a6a;
    border-radius: 3px;
  }

  /* Responsive tweaks */
  @media (max-width: 400px) {
    #app {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }
  }

</style>
</head>
<body>
  <div id="app" role="main" aria-label="Nexora Chat Application">
    <header>
      <div>
        Nexora Chat
        <div class="company" aria-label="Parent Company Name">by MultiGen Ai</div>
      </div>
      <button id="toggle-user" aria-pressed="false" aria-label="Toggle active chat user">Active User: User 1</button>
    </header>

    <section id="chat" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Chat message area">
      <!-- Chat messages will appear here -->
    </section>

    <section id="input-section">
      <img id="media-preview" alt="Media preview" />
      <input type="file" id="attach-btn" accept="image/*,video/*,audio/*" aria-label="Attach media" />
      <label for="attach-btn" id="attach-label" title="Attach media" role="button" tabindex="0" aria-hidden="false">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21.44 11.05l-9.7 9.7a3 3 0 01-4.24-4.24l9.7-9.7a1 1 0 011.41 1.42l-9.7 9.7a1 1 0 001.42 1.42l9.7-9.7a3 3 0 00-4.24-4.24l-9.7 9.7a5 5 0 007.07 7.07l9.7-9.7a.99.99 0 00-1.41-1.42z"></path></svg>
      </label>
      <input id="input" type="text" aria-label="Type your message" placeholder="Type a message..." />
      <button id="send-btn" aria-disabled="true" aria-label="Send message">Send</button>
    </section>
  </div>

<script>
  (() => {
    // Maintain chat state and current user
    let activeUser = 'user1'; // user1 or user2
    const userNames = {user1:'User 1', user2:'User 2'};
    const chatContainer = document.getElementById('chat');
    const toggleUserBtn = document.getElementById('toggle-user');
    const inputField = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const attachInput = document.getElementById('attach-btn');
    const mediaPreview = document.getElementById('media-preview');

    // Messages array: each message object = {id, sender, text, media, timestamp}
    const messages = [];

    // Helper to format timestamps
    function formatTimestamp(date = new Date()) {
      return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    // Create message element
    function createMessageElement({id, sender, text, media, timestamp}) {
      const msgEl = document.createElement('div');
      msgEl.classList.add('message', sender === 'user1' ? 'msg-left' : 'msg-right');
      msgEl.setAttribute('data-id', id);
      msgEl.setAttribute('role', 'article');
      msgEl.setAttribute('aria-label', `${userNames[sender]} message`);

      // Text content
      if (text) {
        const textNode = document.createElement('div');
        textNode.textContent = text;
        msgEl.appendChild(textNode);
      }
      // Media content
      if (media) {
        let mediaEl;
        if(media.type.startsWith('image/')) {
          mediaEl = document.createElement('img');
          mediaEl.src = media.data;
          mediaEl.alt = 'Attached image';
          mediaEl.style.maxWidth = '200px';
          mediaEl.style.borderRadius = '12px';
          mediaEl.style.display = 'block';
          mediaEl.style.marginTop = '6px';
        } else if(media.type.startsWith('video/')) {
          mediaEl = document.createElement('video');
          mediaEl.src = media.data;
          mediaEl.controls = true;
          mediaEl.style.maxWidth = '200px';
          mediaEl.style.borderRadius = '12px';
          mediaEl.style.display = 'block';
          mediaEl.style.marginTop = '6px';
        } else if(media.type.startsWith('audio/')) {
          mediaEl = document.createElement('audio');
          mediaEl.src = media.data;
          mediaEl.controls = true;
          mediaEl.style.display = 'block';
          mediaEl.style.marginTop = '6px';
        }
        if(mediaEl) msgEl.appendChild(mediaEl);
      }

      // Timestamp
      const timeEl = document.createElement('span');
      timeEl.classList.add('timestamp');
      timeEl.textContent = formatTimestamp(timestamp);
      msgEl.appendChild(timeEl);

      return msgEl;
    }

    // Append message to chat container and scroll to bottom
    function appendMessage(message) {
      const el = createMessageElement(message);
      chatContainer.appendChild(el);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Update toggle button aria-pressed and label
    function updateToggleUserUI() {
      toggleUserBtn.textContent = `Active User: ${userNames[activeUser]}`;
      toggleUserBtn.setAttribute('aria-pressed', activeUser === 'user2');
      inputField.focus();
    }

    // Handle toggle user
    toggleUserBtn.addEventListener('click', () => {
      activeUser = activeUser === 'user1' ? 'user2' : 'user1';
      updateToggleUserUI();
    });

    // Enable/disable send button based on input or media exists
    function updateSendButtonState() {
      sendBtn.disabled = !(inputField.value.trim() || attachInput.files.length);
      sendBtn.setAttribute('aria-disabled', sendBtn.disabled.toString());
    }

    inputField.addEventListener('input', updateSendButtonState);

    // Show media preview if attached
    attachInput.addEventListener('change', () => {
      if(attachInput.files.length) {
        const file = attachInput.files[0];
        if(file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = e => {
            mediaPreview.src = e.target.result;
            mediaPreview.style.display = 'inline-block';
          };
          reader.readAsDataURL(file);
        } else {
          mediaPreview.style.display = 'none';
          mediaPreview.src = '';
        }
      } else {
        mediaPreview.style.display = 'none';
        mediaPreview.src = '';
      }
      updateSendButtonState();
    });

    // Clear input and media
    function clearInputs() {
      inputField.value = '';
      attachInput.value = '';
      mediaPreview.src = '';
      mediaPreview.style.display = 'none';
      updateSendButtonState();
    }

    // Handle send message
    sendBtn.addEventListener('click', () => {
      const text = inputField.value.trim();
      const file = attachInput.files[0];
      if(!text && !file) return;

      if(file) {
        const reader = new FileReader();
        reader.onload = e => {
          const newMsg = {
            id: Date.now().toString(),
            sender: activeUser,
            text: text || '',
            media: {type: file.type, data: e.target.result},
            timestamp: new Date(),
          };
          messages.push(newMsg);
          appendMessage(newMsg);
          clearInputs();
        };
        reader.readAsDataURL(file);
      } else {
        const newMsg = {
          id: Date.now().toString(),
          sender: activeUser,
          text,
          media: null,
          timestamp: new Date(),
        };
        messages.push(newMsg);
        appendMessage(newMsg);
        clearInputs();
      }
    });

    // Initial UI setup
    updateToggleUserUI();
    updateSendButtonState();

  })();
</script>
</body>
</html>
